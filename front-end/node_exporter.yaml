apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: twitter-environment
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.6.0
        ports:
        - containerPort: 9100
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-service
  namespace: twitter-environment
spec:
  type: ClusterIP
  selector:
    app: node-exporter
  ports:
  - port: 9100
    targetPort: 9100
